version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - DB_TYPE=mongodb
      - DB_MONGODB_CONNECTION_URL=mongodb://admin:password@mongodb:27017/n8n?authSource=admin
      - WEBHOOK_URL=http://localhost:5678/
    depends_on:
      - mongodb
    volumes:
      - n8n_storage:/home/node/.n8n
    networks:
      - healthcare_network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=healthcare_db
    volumes:
      - mongodb_storage:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - healthcare_network
    restart: unless-stopped

volumes:
  n8n_storage:
    driver: local
  mongodb_storage:
    driver: local

networks:
  healthcare_network:
    driver: bridge
